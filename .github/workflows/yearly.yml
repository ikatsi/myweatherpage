name: Yearly maps

on:
  workflow_dispatch:

concurrency:
  group: yearly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-yearly-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MPLBACKEND: Agg
      PRIVATE_CURRENTYEAR_URL:   ${{ secrets.PRIVATE_CURRENTYEAR_URL }}
      PRIVATE_CURRENTYEAR_TOKEN: ${{ secrets.PRIVATE_CURRENTYEAR_TOKEN }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
      STATION_EXCLUSION_RULES: ${{ secrets.STATION_EXCLUSION_RULES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt greece.geojson if needed
        if: ${{ hashFiles('greece.geojson') == '' }}
        run: |
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in greece.geojson.enc \
            -out greece.geojson \
            -pass pass:"${GEOJSON_PASS}"

      - name: Check decrypted GeoJSON
        run: |
          test -f greece.geojson || { echo "greece.geojson missing"; exit 1; }

      - name: Run yearly.py
        run: |
          python -V
          python yearly.py
