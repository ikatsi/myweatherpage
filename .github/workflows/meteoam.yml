name: meteoam

on:
  workflow_dispatch:

concurrency:
  group: meteoam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-meteoam:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MPLBACKEND: Agg
      PRIVATE_WEATHERNOW_URL: ${{ secrets.PRIVATE_WEATHERNOW_URL }}
      PRIVATE_WEATHERNOW_TOKEN: ${{ secrets.PRIVATE_WEATHERNOW_TOKEN }}
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
      BRAND_NAME: ${{ secrets.BRAND_NAME }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      HSAF_HOST: ${{ secrets.HSAF_HOST }}
      HSAF_USER: ${{ secrets.HSAF_USER }}
      HSAF_PASS: ${{ secrets.HSAF_PASS }}
      HSAF_REMOTE_DIR: ${{ secrets.HSAF_REMOTE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-meteoam-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-meteoam-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            proj-data \
            proj-bin \
            libgeos-dev \
            libopenjp2-7 \
            libopenjp2-7-dev \
            libspatialindex-dev \
            libnetcdf-dev \
            netcdf-bin \
            openssl

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files exist
        run: |
          test -f meteoam.py || { echo "meteoam.py missing"; exit 1; }
          test -f requirements.txt || { echo "requirements.txt missing"; exit 1; }
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -f altitude.zip.enc || { echo "altitude.zip.enc missing"; exit 1; }

      - name: Decrypt greece.geojson if needed
        if: ${{ hashFiles('greece.geojson') == '' }}
        run: |
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in greece.geojson.enc \
            -out greece.geojson \
            -pass pass:"${GEOJSON_PASS}"

      - name: Decrypt + unzip DEM bundle if needed
        if: ${{ hashFiles('GRC_alt.vrt') == '' }}
        run: |
          test -f altitude.zip.enc || { echo "altitude.zip.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in altitude.zip.enc \
            -out altitude.zip \
            -pass pass:"${GEOJSON_PASS}"
          unzip -o altitude.zip
          rm -f altitude.zip
          test -f GRC_alt.vrt || { echo "GRC_alt.vrt missing after unzip"; exit 1; }

      - name: Run meteoam.py
        run: |
          python meteoam.py

      - name: Cleanup local outputs
        if: always()
        run: |
          rm -rf ptype_hsaf_greece hsaf_cache altitude.zip || true
