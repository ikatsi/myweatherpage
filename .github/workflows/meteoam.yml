name: meteoam

on:
  workflow_dispatch:

concurrency:
  group: meteoam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-meteoam:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MPLBACKEND: Agg

      CURRENTWEATHER_URL: ${{ secrets.CURRENTWEATHER_URL }}
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
      BRAND_NAME: ${{ secrets.BRAND_NAME }}

      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}

      HSAF_HOST: ${{ secrets.HSAF_HOST }}
      HSAF_USER: ${{ secrets.HSAF_USER }}
      HSAF_PASS: ${{ secrets.HSAF_PASS }}
      HSAF_REMOTE_DIR: ${{ secrets.HSAF_REMOTE_DIR }}

    steps:
      - name: Debug context
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "default_branch=${{ github.event.repository.default_branch }}"
          date -u +"UTC now: %Y-%m-%d %H:%M:%S"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-meteoam-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-meteoam-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            proj-data \
            proj-bin \
            libgeos-dev \
            libopenjp2-7 \
            libopenjp2-7-dev \
            libspatialindex-dev \
            libnetcdf-dev \
            netcdf-bin \
            openssl

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files exist
        run: |
          test -f meteoam.py || { echo "meteoam.py missing"; exit 1; }
          test -f requirements.txt || { echo "requirements.txt missing"; exit 1; }
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -f altitude.zip.enc || { echo "altitude.zip.enc missing"; exit 1; }
          test -d docs/testmaps || { echo "docs/testmaps missing"; exit 1; }

      - name: Decrypt greece.geojson if needed
        if: ${{ hashFiles('greece.geojson') == '' }}
        run: |
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in greece.geojson.enc \
            -out greece.geojson \
            -pass pass:"${GEOJSON_PASS}"

          ls -l greece.geojson

      - name: Decrypt + unzip DEM bundle if needed
        if: ${{ hashFiles('GRC_alt.vrt') == '' }}
        run: |
          test -f altitude.zip.enc || { echo "altitude.zip.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in altitude.zip.enc \
            -out altitude.zip \
            -pass pass:"${GEOJSON_PASS}"

          unzip -o altitude.zip
          rm -f altitude.zip

          test -f GRC_alt.vrt || { echo "GRC_alt.vrt missing after unzip"; ls -la; exit 1; }
          ls -l GRC_alt.vrt

      - name: Debug CURRENTWEATHER_URL response headers
        run: |
          python - <<'PY'
          import os, requests
          url = os.environ.get("CURRENTWEATHER_URL", "").strip()
          print("URL set:", bool(url))
          if not url:
              raise SystemExit("CURRENTWEATHER_URL is empty")
          r = requests.get(
              url,
              headers={
                  "Accept": "text/plain, text/*;q=0.9, */*;q=0.8",
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=20,
          )
          print("Status:", r.status_code)
          print("Content-Type:", r.headers.get("Content-Type"))
          txt = (r.text or "")
          print("First 200 chars:", txt[:200].replace("\n", " "))
          r.raise_for_status()
          PY

      - name: Run meteoam.py
        run: |
          python -V
          python meteoam.py

      - name: Copy PNGs to docs/testmaps
        if: always()
        run: |
          mkdir -p docs/testmaps
          if [ -d ptype_hsaf_greece ]; then
            cp -f ptype_hsaf_greece/*.png docs/testmaps/ 2>/dev/null || true
          fi
          ls -la docs/testmaps || true

      - name: Upload meteoam artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteoam_outputs
          path: |
            ptype_hsaf_greece/**
            docs/testmaps/**
          if-no-files-found: warn
          retention-days: 7
