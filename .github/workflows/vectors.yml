name: Vector maps

on:
  workflow_dispatch:

concurrency:
  group: vectors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-vector-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MPLBACKEND: Agg
      VECTOR_TSV_BASE_URL: ${{ secrets.VECTOR_TSV_BASE_URL }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt Greece GeoJSON if needed
        run: |
          if [ -f vectors/greece.geojson ]; then
            echo "vectors/greece.geojson already exists"
          elif [ -f greece.geojson ]; then
            echo "greece.geojson already exists in repo root"
          elif [ -f vectors/greece.geojson.enc ]; then
            test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in vectors/greece.geojson.enc \
              -out vectors/greece.geojson \
              -pass pass:"${GEOJSON_PASS}"
          elif [ -f greece.geojson.enc ]; then
            test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in greece.geojson.enc \
              -out greece.geojson \
              -pass pass:"${GEOJSON_PASS}"
          else
            echo "No Greece GeoJSON or encrypted Greece GeoJSON found"
            exit 1
          fi

      - name: Check DEM availability
        run: |
          if [ -f vectors/GRC_alt_filled.tif ]; then
            echo "vectors/GRC_alt_filled.tif exists"
          elif [ -f GRC_alt_filled.tif ]; then
            echo "GRC_alt_filled.tif exists in repo root"
          elif [ -f vectors/altitude.zip.enc ]; then
            echo "Encrypted altitude bundle exists in vectors/"
          elif [ -f altitude.zip.enc ]; then
            echo "Encrypted altitude bundle exists in repo root"
          else
            echo "No DEM or encrypted altitude bundle found"
            exit 1
          fi

      - name: Run vectors.py
        run: |
          python -V
          python vectors.py
