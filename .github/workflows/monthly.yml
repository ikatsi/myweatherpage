name: Monthly maps

on:
  workflow_dispatch:

jobs:
  generate-monthly-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy geopandas matplotlib requests pyogrio shapely fiona

      - name: Generate current month maps
        env:
          CURRENTMONTHURL: ${{ secrets.CURRENTMONTHURL }}
          GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python monthly.py
