name: Test Rain Intensity Lightning Maps

on:
  workflow_dispatch:

jobs:
  build-test-map:
    runs-on: ubuntu-latest

    env:
      # Weather feed
      PRIVATE_WEATHERNOW_URL: ${{ secrets.PRIVATE_WEATHERNOW_URL }}
      PRIVATE_WEATHERNOW_TOKEN: ${{ secrets.PRIVATE_WEATHERNOW_TOKEN }}

      # Encrypted map/altitude assets
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}

      # Optional branding
      BRAND_NAME: ${{ secrets.BRAND_NAME }}

      # Optional FTP upload, used only if your test.py sees all three
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}

      # EUMETSAT MTG-LI lightning
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      LI_ENABLED: "1"
      LI_COLLECTION_ID: "EO:EUM:DAT:0691"
      LI_LOOKBACK_MIN: "30"
      LI_MAX_PRODUCTS: "12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            geopandas \
            matplotlib \
            scipy \
            rasterio \
            pyproj \
            shapely \
            requests \
            eumdac \
            netCDF4

      - name: Decrypt Cyprus GeoJSON if needed
        if: ${{ hashFiles('cyprus.geojson') == '' }}
        run: |
          test -f cyprus.geojson.enc || { echo "cyprus.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in cyprus.geojson.enc \
            -out cyprus.geojson \
            -pass pass:"${GEOJSON_PASS}"

      - name: Decrypt Cyprus altitude raster if needed
        if: ${{ hashFiles('cyprus_dsm_90m.tif') == '' }}
        run: |
          test -f cyprus.tif.enc || { echo "cyprus.tif.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in cyprus.tif.enc \
            -out cyprus_dsm_90m.tif \
            -pass pass:"${GEOJSON_PASS}"

      - name: Run Greece and Cyprus test maps
        run: |
          python test.py

      - name: Upload generated PNGs as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-rainintensity-lightning-output
          path: |
            rainintensitymaps/*.png
            cyprusrainintensitymaps/*.png
            *.log
          if-no-files-found: warn
