name: Test cloud and rain maps

on:
  workflow_dispatch:
    inputs:
      cloud_wms_layer:
        description: "Cloud WMS layer (e.g. msg_fes:ir108 or msg_fes:clm)"
        required: false
        default: "msg_fes:ir108"
      rain_zoom:
        description: "RainViewer zoom level (0-10)"
        required: false
        default: "7"

jobs:
  build-test-maps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            matplotlib \
            requests \
            pillow \
            pyproj \
            geopandas \
            shapely \
            rasterio \
            fiona

      - name: Run test.py
        env:
          GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          CLOUD_WMS_LAYER: ${{ github.event.inputs.cloud_wms_layer }}
          RAIN_ZOOM: ${{ github.event.inputs.rain_zoom }}
        run: python test.py

      - name: Upload generated maps as artifact
        uses: actions/upload-artifact@v4
        with:
          name: testmaps
          path: testmaps/*.png
          if-no-files-found: warn
