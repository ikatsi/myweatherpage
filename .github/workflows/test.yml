name: Test cloud and rain maps

on:
  workflow_dispatch:

concurrency:
  group: test-maps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
      FTP_HOST:     ${{ secrets.FTP_HOST }}
      FTP_USER:     ${{ secrets.FTP_USER }}
      FTP_PASS:     ${{ secrets.FTP_PASS }}
      CLOUD_WMS_LAYER: ${{ secrets.CLOUD_WMS_LAYER }}
      RAIN_ZOOM: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check encrypted assets exist
        shell: bash
        run: |
          set -euo pipefail
          ls -lh \
            greece.geojson.enc \
            cyprus.geojson.enc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-testmaps-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-testmaps-

      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --only-binary=:all: \
            numpy matplotlib requests pillow \
            shapely pyproj fiona geopandas pyogrio

      - name: Decrypt Greece GeoJSON
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in greece.geojson.enc \
            -out greece.geojson \
            -pass pass:"${GEOJSON_PASS}"
          ls -lh greece.geojson

      - name: Decrypt Cyprus GeoJSON
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          test -f cyprus.geojson.enc || { echo "cyprus.geojson.enc missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in cyprus.geojson.enc \
            -out cyprus.geojson \
            -pass pass:"${GEOJSON_PASS}"
          ls -lh cyprus.geojson

      - name: Run test.py
        shell: bash
        run: |
          set -euo pipefail
          python -V
          python test.py --region all

      - name: Upload PNG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testmaps
          path: testmaps/*.png
          if-no-files-found: warn
          retention-days: 7
