name: Test Tnow maps

on:
  workflow_dispatch:

concurrency:
  group: test-tnow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MPLBACKEND: Agg
      PRIVATE_WEATHERNOW_URL: ${{ secrets.PRIVATE_WEATHERNOW_URL }}
      PRIVATE_WEATHERNOW_TOKEN: ${{ secrets.PRIVATE_WEATHERNOW_TOKEN }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
      STATION_EXCLUSION_RULES: ${{ secrets.STATION_EXCLUSION_RULES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-tnow-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-tnow-
            ${{ runner.os }}-pip-tnow-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: \
            numpy pandas matplotlib scipy requests \
            rasterio shapely pyproj fiona geopandas

      - name: Decrypt greece.geojson if needed
        if: ${{ hashFiles('greece.geojson') == '' }}
        run: |
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in greece.geojson.enc \
            -out greece.geojson \
            -pass pass:"${GEOJSON_PASS}"

      - name: Decrypt cyprus.geojson if needed
        if: ${{ hashFiles('cyprus.geojson') == '' }}
        run: |
          test -f cyprus.geojson.enc || { echo "cyprus.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in cyprus.geojson.enc \
            -out cyprus.geojson \
            -pass pass:"${GEOJSON_PASS}"

      - name: Decrypt Cyprus altitude raster if needed
        if: ${{ hashFiles('cyprus_dsm_90m.tif') == '' }}
        run: |
          test -f cyprus.tif.enc || { echo "cyprus.tif.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in cyprus.tif.enc \
            -out cyprus_dsm_90m.tif \
            -pass pass:"${GEOJSON_PASS}"

      - name: Verify population raster
        run: |
          test -f GRC_population_2021_100m.tif || {
            echo "GRC_population_2021_100m.tif missing"
            exit 1
          }
          ls -lh GRC_population_2021_100m.tif

      - name: Check test.py syntax
        run: |
          python -m py_compile test.py

      - name: Run test.py and upload maps
        run: |
          python test.py

      - name: Verify tnow.png was produced
        run: |
          test -f Tnowmaps/tnow.png || {
            echo "Tnowmaps/tnow.png was not produced"
            exit 1
          }
          ls -lh Tnowmaps/tnow.png

      - name: Cleanup local outputs
        if: always()
        run: |
          rm -rf Tnowmaps || true
