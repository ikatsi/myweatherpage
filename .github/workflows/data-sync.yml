name: Process source data

on:
  workflow_dispatch:

  schedule:
    - cron: "7,27,47 * * * *"

concurrency:
  group: process-source-data
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STATION_SOURCES: ${{ secrets.STATION_SOURCES }}
      CLIMATE_FTP_HOST: ${{ secrets.CLIMATE_FTP_HOST }}
      CLIMATE_FTP_USER: ${{ secrets.CLIMATE_FTP_USER }}
      CLIMATE_FTP_PASS: ${{ secrets.CLIMATE_FTP_PASS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            netCDF4==1.7.4 \
            numpy==2.2.6 \
            requests==2.32.4

      - name: Process and upload data
        run: python data_sync.py
