name: Build Tnow maps

on:
  workflow_dispatch:

concurrency:
  group: tnow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tnow:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MPLBACKEND: Agg
      PRIVATE_WEATHERNOW_URL: ${{ secrets.PRIVATE_WEATHERNOW_URL }}
      PRIVATE_WEATHERNOW_TOKEN: ${{ secrets.PRIVATE_WEATHERNOW_TOKEN }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      GEOJSON_PASS: ${{ secrets.GEOJSON_PASS }}
      STATION_EXCLUSION_RULES: ${{ secrets.STATION_EXCLUSION_RULES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tnow-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-tnow-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: \
            numpy pandas matplotlib scipy requests \
            rasterio shapely pyproj fiona geopandas

      - name: Decrypt greece.geojson if needed
        if: ${{ hashFiles('greece.geojson') == '' }}
        run: |
          test -f greece.geojson.enc || { echo "greece.geojson.enc missing"; exit 1; }
          test -n "${GEOJSON_PASS}" || { echo "GEOJSON_PASS not set"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in greece.geojson.enc \
            -out greece.geojson \
            -pass pass:"${GEOJSON_PASS}"

      - name: Run tnow.py
        run: |
          python tnow.py

      - name: Cleanup local outputs
        if: always()
        run: |
          rm -rf Tnowmaps || true
